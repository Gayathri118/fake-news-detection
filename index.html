<!DOCTYPE html>
<html>
<head>
    <title>Fake News Detection</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #667eea, #764ba2);
            text-align: center;
            color: white;
            margin: 0;
            padding: 0;
        }

        .container {
            margin-top: 80px;
            background: white;
            color: black;
            width: 400px;
            margin-left: auto;
            margin-right: auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0px 0px 15px rgba(0,0,0,0.2);
        }

        h1 {
            margin-bottom: 20px;
        }

        textarea {
            width: 100%;
            height: 120px;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid #ccc;
        }

        button {
            margin-top: 15px;
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            background-color: #667eea;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #5a67d8;
        }

        .result {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
        }

        .real {
            color: green;
        }

        .fake {
            color: red;
        }
    </style>
</head>

<body>

    <h1>📰 Fake News Detection System</h1>

    <div class="container">
        <form action="/predict" method="post">
            <textarea name="news" placeholder="Enter news text here..."></textarea>
            <br>
            <button type="submit">Check News</button>
        </form>

        {% if prediction_text %}
            <div class="result 
                {% if 'Real' in prediction_text %}real{% else %}fake{% endif %}">
                {{ prediction_text }}
            </div>
        {% endif %}
    </div>

</body>
</html>
